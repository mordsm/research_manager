[project]
name = "research-manager"
version = "0.1.0"
description = "Phase 1 Research Manager orchestration backend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "langgraph>=0.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.6",
  "uvicorn>=0.32",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

